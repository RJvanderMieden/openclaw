[project]
name = "soul-system"
version = "0.1.0"
description = "SOUL.md system prompt assembler for Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "claude-agent-sdk>=0.1.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soul_system"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
