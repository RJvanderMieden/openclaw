[project]
name = "soul-system"
version = "0.2.0"
description = "SOUL.md workspace system for the Claude Agent SDK — soul files loaded natively via CLAUDE.md @import"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
sdk = [
    "claude-agent-sdk>=0.1.30",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soul_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
